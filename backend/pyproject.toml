[project]
name = "customer-360-backend"
version = "0.1.0"
description = "Gate 4 FastAPI Customer 360 + Admin load lab"
requires-python = ">=3.10"
dependencies = [
    "aerospike>=15.0.0,<17",
    "faker>=30.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
