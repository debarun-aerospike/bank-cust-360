# Aerospike Enterprise — Customer 360 lab (namespace `bank`)
# Mounted at /opt/aerospike/etc/aerospike.conf
# Compatible with Aerospike Database 7+ in-memory storage (data-size).

service {
	cluster-name bank-c360
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		address any
		port 3001
	}

	info {
		address any
		port 3003
	}
}

# Persistent demo data: default-ttl 0 = never expire; nsup-period 0 = NSUP off.
namespace bank {
	replication-factor 1
	default-ttl 0
	nsup-period 0

	storage-engine memory {
		# Laptop / small seed. Raise (e.g. 16G–64G) on shared hosts for ≥5M customers.
		data-size 4G
	}
}
