# Customer 360 full stack — Aerospike + seed + API + UI
# From repo root:
#   Local Aerospike (default):  docker compose up --build -d
#   External Aerospike:         docker compose -f docker-compose.yml -f docker-compose.external.yml up --build -d
#                               (set AEROSPIKE_HOSTS / auth in .env first)
#
# UI:     http://127.0.0.1:4000
# API:    http://127.0.0.1:18000/docs
# AS:     127.0.0.1:13000 when using the bundled lab DB

services:
  aerospike:
    image: aerospike/aerospike-server-enterprise:latest
    container_name: bank-c360-aerospike
    ports:
      # Host ports offset to avoid clashing with another local Aerospike on 3000.
      - "13000:3000"
      - "13001:3001"
      - "13002:3002"
      - "13003:3003"
    volumes:
      - ./ops/docker/aerospike.conf:/opt/aerospike/etc/aerospike.conf:ro
    command: ["--config-file", "/opt/aerospike/etc/aerospike.conf"]
    healthcheck:
      test: ["CMD", "asinfo", "-v", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  seed:
    build:
      context: ./ops/seed
    container_name: bank-c360-seed
    depends_on:
      aerospike:
        condition: service_healthy
    environment:
      SEED_CUSTOMERS: ${SEED_CUSTOMERS:-100}
      SEED_COUNTRY: ${SEED_COUNTRY:-India}
      AEROSPIKE_HOSTS: ${AEROSPIKE_HOSTS:-aerospike:3000}
      AEROSPIKE_USER: ${AEROSPIKE_USER:-}
      AEROSPIKE_PASSWORD: ${AEROSPIKE_PASSWORD:-}
    entrypoint: ["uv", "run", "--no-sync", "python", "seed.py"]
    command:
      - --hosts=${AEROSPIKE_HOSTS:-aerospike:3000}
      - --customers=${SEED_CUSTOMERS:-100}
      - --country=${SEED_COUNTRY:-India}
      - --checkpoint-every=${SEED_CHECKPOINT_EVERY:-1000}
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bank-c360-backend
    depends_on:
      aerospike:
        condition: service_healthy
        required: false
      seed:
        condition: service_completed_successfully
        required: false
    ports:
      - "18000:8000"
    environment:
      # Local compose default: in-network service name. Override for an external cluster.
      AEROSPIKE_HOSTS: ${AEROSPIKE_HOSTS:-aerospike:3000}
      AEROSPIKE_HOST: ${AEROSPIKE_HOST:-aerospike}
      AEROSPIKE_PORT: ${AEROSPIKE_PORT:-3000}
      AEROSPIKE_NAMESPACE: ${AEROSPIKE_NAMESPACE:-bank}
      AEROSPIKE_USER: ${AEROSPIKE_USER:-}
      AEROSPIKE_PASSWORD: ${AEROSPIKE_PASSWORD:-}
      AEROSPIKE_CONFIG_FILE: ${AEROSPIKE_CONFIG_FILE:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin:admin}
      SEEDED_CUSTOMER_MAX: ${SEED_CUSTOMERS:-100}
      SEED_DIR: /app/ops/seed
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://127.0.0.1:18000}
        NEXT_PUBLIC_ADMIN_TOKEN: ${ADMIN_TOKEN:-admin:admin}
    container_name: bank-c360-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4000:4000"
